name: Nightly
run-name: "Nightly on ${{ github.ref_name }}"

# The extended tier: every parser fuzzed for five minutes, the shuffled
# race stress runs, the tests on a 32-bit architecture, and the interop
# suite against the pinned reference servers. OTFP_REQUIRE_INTEROP=1 turns
# a missing prerequisite into a failure.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        required: false
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz every target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: |
          if ! [[ "$FUZZTIME" =~ ^[0-9]+(ns|us|ms|s|m|h|x)$ ]]; then
            echo "::error::fuzztime must be a Go duration such as 5m or a count such as 1000x"
            exit 1
          fi
          make fuzz FUZZTIME="$FUZZTIME"
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore

  stress:
    name: Stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make stress

  # Platform width (otfabric/engineering standards/testing.md#platform-width):
  # the parsers convert wire lengths and counts to int, and the module is
  # built for a 32-bit platform (linux/arm), so the tests also run where int
  # has 32 bits. ubuntu runners execute 386 binaries; the race detector does
  # not exist for 386.
  test-386:
    name: Tests on a 32-bit architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests on a 32-bit architecture
        run: GOARCH=386 go test -count=1 ./...

  interop:
    name: Interop
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check out the fixture repositories beside go-otfp
        run: |
          for r in snap7-interop opcua-interop ieee20305-interop; do
            git clone -q --depth 1 "https://github.com/otfabric/$r.git" "../$r"
          done
      - name: Load the CAN modules (CANopen gateway test on vcan)
        run: |
          # linux-modules-extra carries can, can-raw and vcan on hosted runners.
          if ! sudo modprobe -a can can-raw vcan 2>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe -a can can-raw vcan
          fi
      - name: Interop suite
        env:
          OTFP_REQUIRE_INTEROP: "1"
        run: make interop
