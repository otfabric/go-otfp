name: Nightly
run-name: "Nightly on ${{ github.ref_name }}"

# The extended tier: every parser fuzzed for five minutes, the shuffled
# race stress runs, and the interop suite against the pinned reference
# servers. OTFP_REQUIRE_INTEROP=1 turns a missing prerequisite into a
# failure.

on:
  push:
    branches: [chore/should-gaps]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        required: false
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=${{ inputs.fuzztime || '5s' }}
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore

  stress:
    name: Stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make stress

  interop:
    name: Interop
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check out the fixture repositories beside go-otfp
        run: |
          for r in snap7-interop opcua-interop ieee20305-interop; do
            git clone -q --depth 1 "https://github.com/otfabric/$r.git" "../$r"
          done
      - name: Interop suite
        env:
          OTFP_REQUIRE_INTEROP: "1"
        run: make interop
