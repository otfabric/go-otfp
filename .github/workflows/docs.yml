# Documents against the code (DOC-008, standards/documentation.md#doc-sync).
# pr.yml calls it on every pull request; on main it runs on every push, with
# no path filter.
name: Docs
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Library
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.8.0
    with:
      policy-version: v1.6.1
      docsync-version: v0.3.1
    secrets: inherit

  # The CLI is a nested module: docsync runs once per module. The policy
  # check is about the repository and runs in the job above.
  docs-otprobe:
    name: otprobe
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.8.0
    with:
      module-dir: cmd/otprobe
      policy-version: v1.6.1
      docsync-version: v0.3.1
    secrets: inherit
